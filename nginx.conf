# ─── AI Support Platform — Nginx Configuration ──────────────────────────
# Place this file in /etc/nginx/conf.d/ or mount it in docker-compose.
#
# Replace api.example.com with your actual domain.
# Ensure SSL certificates exist at the paths below (Let's Encrypt).
# ──────────────────────────────────────────────────────────────────────────

upstream django {
    server web:8000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.example.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ─── SSL ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security Headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # ─── Gzip Compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── BLOCK Knowledge Base Access ──────────────────────────────────
    # The vector store (chunks.json, embeddings.npy, metadata.json) must
    # NEVER be accessible via HTTP. Block all paths under /Data/.
    location ~* ^/data/ {
        deny all;
        return 404;
    }

    # Block access to hidden files and directories (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common attack paths
    location ~* ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|admin\.php) {
        return 404;
    }

    # ─── Static Files (with long cache) ───────────────────────────────
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Media Files ──────────────────────────────────────────────────
    # Source documents (PDFs, DOCX, TXT) uploaded for RAG processing
    # must NOT be publicly downloadable. Only serve non-document media.
    location /media/ {
        # Block uploaded source documents (the knowledge base source files)
        location ~* ^/media/documents/ {
            deny all;
            return 403;
        }
        alias /usr/share/nginx/media/;
        expires 7d;
        access_log off;
    }

    # ─── API + Admin → Django ─────────────────────────────────────────
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx overwrites X-Forwarded-For to prevent spoofing:
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM requests can take a while
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;

        # Limit request body size (matches Django + middleware settings)
        client_max_body_size 25M;
    }

    # ─── Health check (for load balancers, no throttle) ───────────────
    location = /api/health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ─── Rate limit admin login ───────────────────────────────────────
    # Brute force protection on /admin/login/
    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─── Rate Limit Zones ───────────────────────────────────────────────────
# Place this in http {} block (main nginx.conf) or here if included
# directly. Docker mount overrides the full file, so we include it.
# Add to /etc/nginx/nginx.conf (http block):
#   limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
