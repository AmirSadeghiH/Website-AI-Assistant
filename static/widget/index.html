<script>
(function(){
  const WIDGET_CSS = `
  :host{ all: initial; }
  *{ box-sizing:border-box; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  button{ font-family: inherit; }
  .aw-root{ position:fixed; inset:auto 20px 20px auto; z-index:2147483647; display:flex; flex-direction:column; align-items:flex-end; gap:14px; }
  .aw-fab{ width:60px; height:60px; border-radius:50%; border:0; cursor:pointer; background:linear-gradient(135deg,#5048E5 0%,#7C3AED 100%); color:#fff; display:grid; place-items:center; box-shadow:0 12px 30px rgba(80,72,229,.38), 0 4px 10px rgba(0,0,0,.15); transition:transform .2s, box-shadow .2s; position:relative; }
  .aw-fab:hover{ transform:translateY(-2px) scale(1.02); box-shadow:0 16px 36px rgba(80,72,229,.42) }
  .aw-fab:active{ transform:scale(.98) }
  .aw-fab-badge{ position:absolute; top:-2px; right:-2px; background:#EF4444; color:#fff; font-size:11px; font-weight:800; min-width:20px; height:20px; padding:0 6px; border-radius:999px; display:grid; place-items:center; border:2px solid #fff; line-height:1; }
  .aw-fab-badge[hidden]{ display:none !important; }
  .aw-fab-icon{ display:grid; place-items:center; transition:opacity .2s, transform .2s; }
  .aw-fab-icon[hidden]{ display:none !important; }

  .aw-panel{ width:380px; height:560px; max-height: calc(100dvh - 90px); background:#fff; border-radius:20px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(15,23,42,.18), 0 8px 24px rgba(15,23,42,.12); border:1px solid #E2E8F0; transform-origin: bottom right; transform: translateY(12px) scale(.98); opacity:0; pointer-events:none; transition: transform .32s cubic-bezier(.16,1,.3,1), opacity .22s ease; }
  .aw-panel.aw-open{ transform: translateY(0) scale(1); opacity:1; pointer-events:auto; }
  .aw-header{ background:linear-gradient(135deg,#5048E5 0%, #6366F1 55%, #7C3AED 100%); color:#fff; padding:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; overflow:hidden; }
  .aw-header::after{ content:""; position:absolute; inset:auto -40px -40px auto; width:120px; height:120px; background:radial-gradient(circle at center, rgba(255,255,255,.18), transparent 70%); pointer-events:none; }
  .aw-header-left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .aw-avatar-wrap{ position:relative; flex-shrink:0; }
  .aw-avatar{ width:42px; height:42px; border-radius:50%; background:#fff; color:#5048E5; display:grid; place-items:center; font-weight:800; font-size:12px; letter-spacing:.04em; border:2px solid rgba(255,255,255,.9); }
  .aw-online{ position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; background:#22C55E; border:2px solid #5048E5; border-radius:50%; }
  .aw-header-text{ min-width:0; }
  .aw-title{ font-weight:700; font-size:15px; line-height:1.1; display:flex; align-items:center; gap:6px; }
  .aw-title-badge{ font-size:10px; font-weight:800; letter-spacing:.06em; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.25); padding:3px 6px; border-radius:999px; }
  .aw-subtitle{ font-size:12.5px; opacity:.9; display:flex; align-items:center; gap:6px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .aw-dot{ width:6px; height:6px; background:#22C55E; border-radius:50%; display:inline-block; box-shadow:0 0 0 4px rgba(34,197,94,.22); flex-shrink:0; }
  .aw-header-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .aw-icon-btn{ width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; cursor:pointer; backdrop-filter: blur(6px); transition:.2s; }
  .aw-icon-btn:hover{ background:rgba(255,255,255,.22) }
  .aw-icon-btn svg{ width:16px; height:16px; stroke-width:2; }

  .aw-body{ flex:1; display:flex; flex-direction:column; min-height:0; background:#F8FAFC; position:relative; }
  .aw-messages{ flex:1; overflow-y:auto; padding:18px 14px 10px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
  .aw-messages::-webkit-scrollbar{ width:6px } .aw-messages::-webkit-scrollbar-thumb{ background:#E2E8F0; border-radius:999px }
  .aw-day{ align-self:center; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#94A3B8; background:#fff; border:1px solid #E2E8F0; padding:4px 8px; border-radius:999px; }
  .aw-msg-row{ display:flex; gap:8px; align-items:flex-end; max-width:86%; }
  .aw-msg-row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .aw-msg-row.bot{ align-self:flex-start; }
  .aw-msg-avatar{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:800; flex-shrink:0; }
  .aw-msg-row.bot .aw-msg-avatar{ background:#fff; border:1px solid #E2E8F0; color:#5048E5; }
  .aw-msg-row.user .aw-msg-avatar{ background:linear-gradient(135deg,#5048E5,#7C3AED); color:#fff; }
  .aw-bubble{ padding:11px 14px; border-radius:18px; font-size:13.5px; line-height:1.5; position:relative; word-break:break-word; box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .aw-msg-row.bot .aw-bubble{ background:#fff; color:#0F172A; border:1px solid #E2E8F0; border-bottom-left-radius:6px; }
  .aw-msg-row.user .aw-bubble{ background:#5048E5; color:#fff; border-bottom-right-radius:6px; }
  .aw-time{ font-size:11px; color:#94A3B8; margin-top:4px; padding:0 2px; }
  .aw-msg-row.user .aw-time{ text-align:right; }

  .aw-typing{ display:flex; gap:8px; align-items:center; padding:0 14px 8px; }
  .aw-typing[hidden]{ display:none !important; }
  .aw-typing-bubble{ background:#fff; border:1px solid #E2E8F0; padding:10px 12px; border-radius:18px; border-bottom-left-radius:6px; display:flex; gap:4px; align-items:center; box-shadow:0 2px 10px rgba(15,23,42,.06); }
  .aw-typing-bubble span{ width:6px; height:6px; background:#94A3B8; border-radius:50%; display:inline-block; animation: aw-bounce 1.2s infinite; }
  .aw-typing-bubble span:nth-child(2){ animation-delay:.15s } .aw-typing-bubble span:nth-child(3){ animation-delay:.3s }
  @keyframes aw-bounce{ 0%, 80%, 100%{ transform:translateY(0); opacity:.6 } 40%{ transform:translateY(-6px); opacity:1 } }

  .aw-suggestions{ display:flex; gap:8px; padding:8px 14px 10px; overflow-x:auto; scrollbar-width:none; }
  .aw-suggestions::-webkit-scrollbar{ display:none }
  .aw-suggestions button{ white-space:nowrap; flex-shrink:0; background:#fff; border:1px solid #E2E8F0; color:#334155; font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:999px; cursor:pointer; transition:.15s; }
  .aw-suggestions button:hover{ border-color:#5048E5; color:#5048E5; background:#EEF2FF; transform:translateY(-1px) }

  .aw-footer{ background:#fff; border-top:1px solid #E2E8F0; padding:12px; }
  .aw-input-wrap{ display:flex; align-items:center; gap:8px; background:#F1F5F9; border:1px solid #E2E8F0; border-radius:999px; padding:6px 6px 6px 14px; transition:.2s; }
  .aw-input-wrap:focus-within{ background:#fff; border-color:#A5B4FC; box-shadow:0 0 0 4px rgba(80,72,229,.12); }
  .aw-input{ flex:1; border:0; outline:0; background:transparent; font-size:14px; color:#0F172A; min-width:0; }
  .aw-input::placeholder{ color:#94A3B8 }
  .aw-send{ width:36px; height:36px; border-radius:50%; border:0; background:linear-gradient(135deg,#5048E5,#7C3AED); color:#fff; display:grid; place-items:center; cursor:pointer; flex-shrink:0; transition: transform .15s, opacity .15s, filter .15s; box-shadow:0 6px 14px rgba(80,72,229,.30); }
  .aw-send:disabled{ opacity:.45; cursor:not-allowed; filter:grayscale(.2); box-shadow:none; }
  .aw-send:hover:not(:disabled){ transform:translateY(-1px) }
  .aw-send:active:not(:disabled){ transform:scale(.96) }
  .aw-powered{ text-align:center; font-size:11px; color:#94A3B8; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .aw-powered strong{ color:#64748B; font-weight:700 }
  .aw-powered a{ color:#94A3B8; text-decoration:underline; text-underline-offset:2px; }

  @media (max-width: 480px){
    .aw-root{ inset:auto 0 0 0; align-items:stretch; }
    .aw-panel{ width:100vw; height:100dvh; max-height:100dvh; border-radius:18px 18px 0 0; border-left:0; border-right:0; border-bottom:0; }
    .aw-fab{ margin:0 16px 16px auto; }
  }
  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    .aw-panel, .aw-fab, .aw-typing-bubble span{ transition:none; animation:none; }
  }
  `;

  const SVG = {
    chat: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/><path d="M8 12h8"/><path d="M8 8h5"/></svg>`,
    close: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6 18 18"/></svg>`,
    send: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/></svg>`,
    minus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>`
  };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }
  function formatTime(d=new Date()){
    return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }

  const MOCK_REPLIES = [
    "Got it! I can help with that — could you share a bit more detail so I can give you the exact steps?",
    "Thanks for reaching out! Here's what to try: 1) Clear cache, 2) Log out & back in, 3) Try again. If it still fails, tell me the error code.",
    "Absolutely — you can reset your password from Settings → Security → Reset. The link expires in 15 minutes.",
    "Our team is online! Average reply time is under 2 minutes. While you wait, check our help center for quick answers.",
    "That feature is available on Pro and above. Want me to show you a quick comparison or help you upgrade?",
    "I’ve logged this for our team. In the meantime, try disabling browser extensions — they sometimes block the chat."
  ];

  class AISupportWidget {
    constructor(opts={}){
      this.opts = Object.assign({
        apiEndpoint: 'https://api.example.com/api/chat/',
        position: 'bottom-right',
        primaryColor: '#5048E5',
        title: 'AI Assistant',
        subtitle: 'Online • Replies instantly'
      }, opts);
      this.isOpen = false;
      this.isTyping = false;
      this._init();
    }
    _init(){
      if(document.getElementById('ai-widget-host')) return;
      const host = document.createElement('div');
      host.id = 'ai-widget-host';
      host.style.all = 'initial';
      document.body.appendChild(host);
      this.host = host;
      this.shadow = host.attachShadow({mode:'open'});

      const style = document.createElement('style');
      style.textContent = WIDGET_CSS;
      this.shadow.appendChild(style);

      const root = document.createElement('div');
      root.className = 'aw-root';
      root.innerHTML = `
        <div class="aw-panel" role="dialog" aria-modal="false" aria-label="AI Support Chat" aria-hidden="true">
          <div class="aw-header">
            <div class="aw-header-left">
              <div class="aw-avatar-wrap">
                <div class="aw-avatar">AI</div>
                <span class="aw-online" aria-hidden="true"></span>
              </div>
              <div class="aw-header-text">
                <div class="aw-title">AI Assistant <span class="aw-title-badge">BETA</span></div>
                <div class="aw-subtitle"><span class="aw-dot"></span> Online • Replies instantly</div>
              </div>
            </div>
            <div class="aw-header-actions">
              <button class="aw-icon-btn" data-action="minimize" aria-label="Minimize chat">${SVG.minus}</button>
              <button class="aw-icon-btn" data-action="close" aria-label="Close chat">${SVG.close}</button>
            </div>
          </div>
          <div class="aw-body">
            <div class="aw-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
            <div class="aw-typing" hidden aria-live="polite">
              <div class="aw-msg-avatar" style="width:28px;height:28px;background:#fff;border:1px solid #E2E8F0;color:#5048E5;display:grid;place-items:center;border-radius:50%;font-size:10px;font-weight:800;flex-shrink:0">AI</div>
              <div class="aw-typing-bubble" aria-label="Assistant is typing"><span></span><span></span><span></span></div>
            </div>
            <div class="aw-suggestions" role="group" aria-label="Quick suggestions">
              <button data-suggest="How do I reset my password?">Reset password</button>
              <button data-suggest="Where is my invoice?">Find invoice</button>
              <button data-suggest="Talk to a human">Talk to human</button>
              <button data-suggest="Pricing plans">Pricing</button>
            </div>
          </div>
          <div class="aw-footer">
            <div class="aw-input-wrap">
              <input class="aw-input" type="text" placeholder="Ask anything..." autocomplete="off" aria-label="Message input" />
              <button class="aw-send" aria-label="Send message">${SVG.send}</button>
            </div>
            <div class="aw-powered">Powered by <strong>AI Support</strong> • <a href="#" tabindex="-1">Privacy</a> • <a href="#" tabindex="-1">Help</a></div>
          </div>
        </div>
        <button class="aw-fab" aria-label="Open chat" aria-expanded="false">
          <span class="aw-fab-icon aw-fab-chat">${SVG.chat}</span>
          <span class="aw-fab-icon aw-fab-close" hidden>${SVG.close}</span>
          <span class="aw-fab-badge">1</span>
        </button>
      `;
      this.shadow.appendChild(root);

      // refs
      this.root = root;
      this.panel = root.querySelector('.aw-panel');
      this.fab = root.querySelector('.aw-fab');
      this.fabChat = root.querySelector('.aw-fab-chat');
      this.fabClose = root.querySelector('.aw-fab-close');
      this.badge = root.querySelector('.aw-fab-badge');
      this.messagesEl = root.querySelector('.aw-messages');
      this.typingEl = root.querySelector('.aw-typing');
      this.input = root.querySelector('.aw-input');
      this.sendBtn = root.querySelector('.aw-send');
      this.suggestions = root.querySelector('.aw-suggestions');

      this._bind();
      this._addBotMessage("Hi there! 👋 I'm your AI assistant. Ask me about billing, account, or product features — I reply instantly. How can I help today?", true);
      // expose
      window._aiWidget = this;
    }

    _bind(){
      this.fab.addEventListener('click', ()=> this.toggle());
      this.shadow.querySelector('[data-action="close"]').addEventListener('click', ()=> this.close());
      this.shadow.querySelector('[data-action="minimize"]').addEventListener('click', ()=> this.close());

      this.sendBtn.addEventListener('click', ()=> this.handleSend());
      this.input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); this.handleSend(); }
      });
      this.input.addEventListener('input', ()=> {
        this.sendBtn.disabled = this.input.value.trim().length===0 || this.isTyping;
      });

      this.suggestions.addEventListener('click', (e)=>{
        const b = e.target.closest('button[data-suggest]');
        if(!b) return;
        this.input.value = b.getAttribute('data-suggest');
        this.sendBtn.disabled = false;
        this.handleSend();
      });

      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape' && this.isOpen) this.close();
      });

      // keep badge logic
      this.fab.addEventListener('mouseenter', ()=> { this.fab.style.transform = 'translateY(-2px) scale(1.02)'; });
      this.fab.addEventListener('mouseleave', ()=> { this.fab.style.transform = ''; });
    }

    open(){
      if(this.isOpen) return;
      this.isOpen = true;
      this.panel.classList.add('aw-open');
      this.panel.setAttribute('aria-hidden','false');
      this.fab.setAttribute('aria-expanded','true');
      this.fabChat.hidden = true;
      this.fabClose.hidden = false;
      this.badge.hidden = true;
      this.badge.style.display='none';
      setTimeout(()=> this.input.focus(), 260);
      this._scrollToBottom();
    }
    close(){
      if(!this.isOpen) return;
      this.isOpen = false;
      this.panel.classList.remove('aw-open');
      this.panel.setAttribute('aria-hidden','true');
      this.fab.setAttribute('aria-expanded','false');
      this.fabChat.hidden = false;
      this.fabClose.hidden = true;
      this.fab.focus();
    }
    toggle(){ this.isOpen ? this.close() : this.open(); }

    _scrollToBottom(){
      requestAnimationFrame(()=>{
        this.messagesEl.scrollTop = this.messagesEl.scrollHeight;
      });
    }
    _showTyping(){
      this.isTyping = true;
      this.typingEl.hidden = false;
      this.sendBtn.disabled = true;
      this.input.disabled = true;
      this.input.placeholder = "AI is typing...";
      this._scrollToBottom();
    }
    _hideTyping(){
      this.isTyping = false;
      this.typingEl.hidden = true;
      this.input.disabled = false;
      this.input.placeholder = "Ask anything...";
      this.sendBtn.disabled = this.input.value.trim().length===0;
      this.input.focus();
    }

    _createRow(text, sender, time){
      const row = document.createElement('div');
      row.className = `aw-msg-row ${sender}`;
      const isUser = sender === 'user';
      const avatar = document.createElement('div');
      avatar.className = 'aw-msg-avatar';
      avatar.textContent = isUser ? 'You' : 'AI';
      const col = document.createElement('div');
      col.style.display='flex';
      col.style.flexDirection='column';
      col.style.maxWidth='100%';
      const bubble = document.createElement('div');
      bubble.className = 'aw-bubble';
      bubble.innerHTML = escapeHtml(text).replace(/\n/g,'<br>');
      const tm = document.createElement('div');
      tm.className='aw-time';
      tm.textContent = time || formatTime();
      col.appendChild(bubble);
      col.appendChild(tm);
      row.appendChild(avatar);
      row.appendChild(col);
      return row;
    }
    _addUserMessage(text){
      const row = this._createRow(text,'user');
      this.messagesEl.appendChild(row);
      this._scrollToBottom();
    }
    _addBotMessage(text, noScrollDelay){
      const row = this._createRow(text,'bot');
      this.messagesEl.appendChild(row);
      if(noScrollDelay) this._scrollToBottom();
      else setTimeout(()=>this._scrollToBottom(), 60);
    }

    async handleSend(){
      const text = this.input.value.trim();
      if(!text || this.isTyping) return;
      this._addUserMessage(text);
      this.input.value = '';
      this.sendBtn.disabled = true;
      // hide suggestions after first user message
      if(this.suggestions) this.suggestions.style.display='none';

      this._showTyping();

      try{
        const reply = await this._callBackend(text);
        this._hideTyping();
        this._addBotMessage(reply);
      }catch(err){
        this._hideTyping();
        // graceful mock fallback
        const fallback = this._mockReply(text);
        this._addBotMessage(fallback + "  (offline demo — backend not configured)");
      }
    }

    // ================= BACKEND INTEGRATION TEMPLATE =================
    // Replace apiEndpoint with your Django REST URL.
    // Expected Django view: POST /api/chat/  body: {"message": "hello"}  ->  {"reply": "hi there"}
    async _callBackend(userText){
      const controller = new AbortController();
      const timeout = setTimeout(()=> controller.abort(), 8000);

      // Try real backend. If it fails (demo has no backend), we throw to trigger mock fallback.
      const res = await fetch(this.opts.apiEndpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          // 'Authorization': 'Bearer YOUR_TOKEN', // uncomment if needed
          // 'X-CSRFToken': getCookie('csrftoken')   // for Django CSRF if needed
        },
        body: JSON.stringify({ message: userText }),
        signal: controller.signal
      });
      clearTimeout(timeout);
      if(!res.ok){
        throw new Error('Backend responded with ' + res.status);
      }
      const data = await res.json();
      // support multiple response shapes: {reply}, {message}, {response}, {answer}
      return data.reply || data.message || data.response || data.answer || "Thanks — I got your message!";
    }

    _mockReply(userText){
      const t = userText.toLowerCase();
      if(t.includes('password') || t.includes('reset')) return "To reset your password: Go to **Settings → Security → Reset password**. We'll email you a secure link (expires in 15 min). Did that work?";
      if(t.includes('invoice') || t.includes('billing') || t.includes('payment')) return "You can find invoices at **Billing → Invoices**. Need a PDF or VAT receipt? Tell me the invoice number and I’ll pull it for you.";
      if(t.includes('human') || t.includes('agent') || t.includes('support')) return "Connecting you to a human is easy — I’ve flagged a teammate. While you wait (avg. 90s), can I try to solve it here?";
      if(t.includes('price') || t.includes('pricing') || t.includes('plan')) return "We have Free, Pro ($19/mo) and Team ($49/mo). Pro includes AI answers, SSO & priority support. Want a side-by-side comparison?";
      if(t.includes('hello') || t.includes('hi') || t.includes('hey')) return "Hey! 👋 I’m here and ready to help. What are you trying to do today?";
      // random friendly
      return MOCK_REPLIES[Math.floor(Math.random()*MOCK_REPLIES.length)];
    }
  }

  function boot(){
    // Allow config via data attributes on script tag
    const current = document.currentScript;
    let api = 'https://api.example.com/api/chat/';
    if(current && current.dataset && current.dataset.api) api = current.dataset.api;
    // Also check global config
    const globalApi = window.AI_WIDGET_CONFIG && window.AI_WIDGET_CONFIG.apiEndpoint;
    if(globalApi) api = globalApi;
    new AISupportWidget({ apiEndpoint: api });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // Expose class for manual instantiation (production usage)
  window.AISupportWidget = AISupportWidget;
})();
</script>
</body>
</html>
