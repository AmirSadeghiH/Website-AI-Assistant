<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>دسترسی موقتاً غیرفعال</title>
  <style>
    body{font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;background:#f3f4f9;color:#191c2e;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{max-width:460px;background:#fff;border:1px solid #e5e7f0;border-radius:16px;box-shadow:0 8px 24px -12px rgba(20,22,39,.12);padding:32px;text-align:center}
    .icon{width:64px;height:64px;border-radius:20px;background:#fdeaea;color:#dc2626;display:grid;place-items:center;margin:0 auto 16px;font-size:28px}
    h1{font-size:18px;margin:0 0 8px}
    p{font-size:13.5px;color:#62688a;line-height:1.9;margin:0 0 18px}
    .btn{display:inline-block;padding:10px 22px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;text-decoration:none;font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>اشتراک شما منقضی شده است</h1>
    <p>دورهٔ فعال پلن «هم پاسخ» به پایان رسیده و دسترسی به پنل و ویجت موقتاً قطع شده است.<br>برای تمدید اشتراک و فعال‌سازی مجدد، با تیم فروش تماس بگیرید.</p>
    <a class="btn" href="/admin/logout/">خروج از حساب</a>
  </div>
</body>
</html>
